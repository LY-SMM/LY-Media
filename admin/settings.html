<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="إعدادات أرقام الاستقبال في ليبيا GO." />
    <title>الإعدادات — إدارة ليبيا GO</title>

    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="admin.css" />

    <script>
      (function () {
        try {
          var t = localStorage.getItem("libyago-admin-theme");
          document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <script src="../js/icons.js" defer></script>
    <script src="../js/ui.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/config.js" defer></script>
    <script src="../js/supabase-client.js" defer></script>
    <script src="../js/auth-session.js" defer></script>
    <script src="../js/validation.js" defer></script>
    <script src="admin.js" defer></script>
  </head>
  <body data-page="settings">
    <a class="skip-link" href="#main">تخطَّ إلى المحتوى الرئيسي</a>

    <div class="admin__layout">
      <aside class="admin__side" id="admin-side"></aside>

      <div class="admin__main">
        <header class="admin__top" id="admin-top"></header>

        <main id="main" tabindex="-1" class="admin__content">
          <section class="card">
            <div class="card__head">
              <h2 class="card__title">
                <span data-icon="card" data-icon-size="20"></span>
                أرقام الاستقبال
              </h2>
            </div>
            <p class="card__text">
              الأرقام التي يُحوَّل إليها المستخدمون لشحن الرصيد. تُطابَق التحويلات
              الواردة مع الشركة والمبلغ.
            </p>

            <form class="form" id="receiver-form" novalidate>
              <div class="field">
                <label class="field__label" for="rcv-company">الشركة</label>
                <select class="select" id="rcv-company">
                  <option value="libyana">ليبيانا</option>
                  <option value="almadar">المدار</option>
                </select>
              </div>
              <div class="field">
                <label class="field__label" for="rcv-phone">رقم الاستقبال</label>
                <input class="input" id="rcv-phone" type="tel" inputmode="numeric" dir="ltr" placeholder="09XXXXXXXX" required />
              </div>
              <button class="btn btn--primary" type="submit">إضافة رقم</button>
            </form>

            <hr class="hr" />

            <div class="table-wrap">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">الشركة</th>
                    <th scope="col">الرقم</th>
                    <th scope="col">الترتيب</th>
                    <th scope="col">مفعّل</th>
                    <th scope="col">إجراءات</th>
                  </tr>
                </thead>
                <tbody id="receivers-body"></tbody>
              </table>
            </div>
          </section>

          <section class="card">
            <div class="card__head">
              <h2 class="card__title">
                <span data-icon="lock" data-icon-size="20"></span>
                تغيير كلمة المرور
              </h2>
            </div>
            <p class="card__text">كلمة مرور جديدة لحساب المشرف الحالي.</p>

            <form class="form" id="password-form" novalidate>
              <div class="field">
                <label class="field__label" for="pwd-new">كلمة المرور الجديدة</label>
                <input class="input" id="pwd-new" type="password" dir="ltr" autocomplete="new-password" minlength="6" required />
              </div>
              <div class="field">
                <label class="field__label" for="pwd-confirm">تأكيد كلمة المرور</label>
                <input class="input" id="pwd-confirm" type="password" dir="ltr" autocomplete="new-password" minlength="6" required />
              </div>
              <button class="btn btn--primary" type="submit">حفظ كلمة المرور</button>
            </form>
          </section>
        </main>
      </div>
    </div>
  </body>
</html>
